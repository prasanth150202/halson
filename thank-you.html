<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You | Armani Hallson KLCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --black:#0B0B0C; --gold:#C9A24B; --bone:#F2EFEA; --muted:#B9B6AE; --line:#2A2A2E; }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--black); color:var(--bone); font-family:Inter,sans-serif; text-align:center; }
  main { width:min(560px,100%); border:1px solid var(--line); padding:56px 32px; background:#151517; border-radius:14px; }
  .mark { color:var(--gold); font-size:42px; line-height:1; margin-bottom:20px; }
  h1 { font:600 48px/1 'Cormorant Garamond',serif; margin:0 0 16px; }
  p { color:var(--muted); line-height:1.7; margin:0; }
  .countdown { color:var(--gold); font-weight:600; margin-top:24px; }
  a { display:inline-block; margin-top:28px; color:var(--black); background:var(--gold); border-radius:999px; padding:13px 22px; font-weight:600; text-decoration:none; }
  a:hover { background:#E4C878; }
</style>
</head>
<body>
<main>
  <div class="mark">&#10003;</div>
  <h1>Thank you</h1>
  <p>Your details have been received. Our team will share the webinar or ROI information with you shortly.</p>
  <p class="countdown">Returning home in <span id="seconds">5</span> seconds</p>
  <a href="./index.html">Return home now</a>
</main>
<script>
  let seconds = 5;
  const counter = document.getElementById('seconds');
  const countdown = setInterval(() => {
    seconds -= 1;
    counter.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(countdown);
      window.location.href = './index.html';
    }
  }, 1000);
</script>
</body>
</html>
